<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork6</title>
    <style>
        /* 
        Colors Used---- 
        Gap Colour: #000
        White: #F0F1EC
        Red: #E72F24
        Black: #232629
        Blue: #004592
        Yellow: #F9D01E

        IMP: We can't change the properties of grid lines.
        But grid lines are transparent!
        */
        body{
            display: flex;
            height: 100%;
            justify-content: center;
            align-items: center;
        }
        .container{
            display: grid;
            grid-template-columns: 50px 100px 50px 50px 100px 50px 100px 50px 150px 100px 50px 50px 50px;
            grid-template-rows: 30px 100px 200px 100px 200px 50px 50px;
            gap: 10px;
            padding: 15px;
            background-color: black;
        }
        .item{
            background-color: #F0F1EC;
        }
        .box1{
            grid-row: span 2;
        }
        .box2{
            grid-column:span 5;
        }
        .box3{
            grid-column:span 5;
        }
        .box4{
                grid-row: span 3;
        }
        .box5{
            grid-row: span 3;
            background-color: #F9D01E;
        }
        .box6{
            grid-column: span 5;
            background-color: #004592;
        }
        .box7{
            grid-column: span 2;
        }
        .box8{
            grid-column: span 3;
            background-color: #004592;
        }
        .box9{
            grid-row: span 2;
            background-color: #232629;
        }
        .box10{
            grid-row: span 2;
        }
        .box11{
            grid-row: span 4;
            background-color: #232629;
        }
        .box12{
            grid-column: span 2;
        }
        .box14{
            grid-column: span 2;
            background-color: #F9D01E;
        }
        .box15{
            grid-column: span 2;
            background-color: #E72F24;
        }
        .box17{
            background-color: #F9D01E;
        }
        .box18{
            grid-column: span 2;
            background-color: #E72F24;
        }
        .box19{
            grid-column: span 2;
            background-color: #004592;
        }
        .box20{
            grid-column: span 2;
        }
        .box22{
            grid-column: span 2;
            background-color: #232629;
        }
        .box23{
            grid-row: span 2;
        }
        .box24{
            grid-row: span 2;
            background-color: #E72F24;
        }
        .box25{
            grid-row: span 3;
            background-color: #F9D01E;
        }
        .box26{
            grid-column: span 3;
        }
        .box27{
            grid-column: span 2;
        }
        .box28{
            background-color: #004592;
        }
        .box29{
            background-color: #F9D01E;
        }
        .box30{
            grid-column: span 2;
        }
        .box31{
            grid-area: 6/5/8/7;
            background-color: #E72F24;
        }
        .box32{
            grid-area: 6/7/8/10;
            background-color: #232629;
        }
        .box33{
            grid-area: 6/10/8/14;
        }
        .box34{
            grid-column: span 3;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="item box1"></div>
        <div class="item box2"></div>
        <div class="item box3"></div>
        <div class="item box4"></div>
        <div class="item box5"></div>
        <div class="item box6"></div>
        <div class="item box7"></div>
        <div class="item box8"></div>
        <div class="item box9"></div>
        <div class="item box10"></div>
        <div class="item box11"></div>
        <div class="item box12"></div>
        <div class="item box13"></div>
        <div class="item box14"></div>
        <div class="item box15"></div>
        <div class="item box16"></div>
        <div class="item box17"></div>
        <div class="item box18"></div>
        <div class="item box19"></div>
        <div class="item box20"></div>
        <div class="item box21"></div>
        <div class="item box22"></div>
        <div class="item box23"></div>
        <div class="item box24"></div>
        <div class="item box25"></div>
        <div class="item box26"></div>
        <div class="item box27"></div>
        <div class="item box28"></div>
        <div class="item box29"></div>
        <div class="item box30"></div>
        <div class="item box31"></div>
        <div class="item box32"></div>
        <div class="item box33"></div>
        <div class="item box34"></div>
    </div>

</body>

</html>
