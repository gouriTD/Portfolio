        Gap Colour: #000
        White: #F0F1EC
        Red: #E72F24
        Black: #232629

        IMP: We can't change the properties of grid lines.
        But grid lines are transparent!
        height: 940, width: 590, gap: 10px, rows: 14, column: 10
