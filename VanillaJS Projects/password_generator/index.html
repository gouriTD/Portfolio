<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="pwd-card">
        <h3>Password Generator</h3>
        <div class="pwd-result">
            <span id="result"></span>
            <button class="btn" id="btn-clipboard"><i class="fa-regular fa-clipboard"></i></button>
        </div>
        <div class="setting pwd-length">
            <label>Password length:</label>
            <input type="number" id="length" value="20" max="20" min="4"/>
        </div>
        <div class="setting uppercase">
            <label>Includes uppercase :</label>
            <input type="checkbox" id="uppercase" checked/>
        </div>
        <div class="setting lowercase">
            <label>Includes lowercase :</label>
            <input type="checkbox" id="lowercase" checked/>
        </div>
        <div class="setting symbol">
            <label>Includes symbol :</label>
            <input type="checkbox" id="symbol" checked/>
        </div>
        <div class="setting number">
            <label>Includes number :</label>
            <input type="checkbox" id="number" checked/>
        </div>
        <div class="btn btn-generate"> Generate Password </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
